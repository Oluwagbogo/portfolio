<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="14" fill="url(#core)" opacity="0.06"/>

  <!-- Connection lines from center (32,32) to each outer node -->
  <!-- Node positions (radius 18): top(32,14), TR(47.6,23), BR(47.6,41), B(32,50), BL(16.4,41), TL(16.4,23) -->
  <line x1="32" y1="32" x2="32" y2="14"   stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="32" y1="32" x2="47.6" y2="23" stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="32" y1="32" x2="47.6" y2="41" stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="32" y1="32" x2="32" y2="50"   stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="32" y1="32" x2="16.4" y2="41" stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="32" y1="32" x2="16.4" y2="23" stroke="white" stroke-width="1.4" stroke-opacity="0.5"/>

  <!-- Hexagon ring edges (connecting adjacent outer nodes) -->
  <line x1="32" y1="14"   x2="47.6" y2="23" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="47.6" y1="23" x2="47.6" y2="41" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="47.6" y1="41" x2="32"   y2="50" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="32" y1="50"   x2="16.4" y2="41" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="16.4" y1="41" x2="16.4" y2="23" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
  <line x1="16.4" y1="23" x2="32"   y2="14" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Outer nodes -->
  <circle cx="32"  cy="14"   r="3" fill="white" opacity="0.85" filter="url(#glow)"/>
  <circle cx="47.6" cy="23"  r="3" fill="white" opacity="0.85" filter="url(#glow)"/>
  <circle cx="47.6" cy="41"  r="3" fill="white" opacity="0.85" filter="url(#glow)"/>
  <circle cx="32"  cy="50"   r="3" fill="white" opacity="0.85" filter="url(#glow)"/>
  <circle cx="16.4" cy="41"  r="3" fill="white" opacity="0.85" filter="url(#glow)"/>
  <circle cx="16.4" cy="23"  r="3" fill="white" opacity="0.85" filter="url(#glow)"/>

  <!-- Center node: outer glow ring -->
  <circle cx="32" cy="32" r="10" fill="white" opacity="0.15"/>
  <!-- Center node: main -->
  <circle cx="32" cy="32" r="7" fill="white" filter="url(#glow)"/>
  <!-- Center node: inner blue dot -->
  <circle cx="32" cy="32" r="3.5" fill="#2563EB"/>
</svg>
